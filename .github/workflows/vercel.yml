# ==============================================================================
# VERCEL DEPLOYMENT WORKFLOW SETUP INSTRUCTIONS
# ==============================================================================
# Since this repository belongs to a GitHub organization and Vercel doesn't provide
# free automated deployments for organization-owned repos, this action deploys
# automatically on every push and pull request targeting `main`.
#
# SETUP INSTRUCTIONS FOR MONOREPO:
# 1. Install the Vercel CLI locally: `npm i -g vercel`
# 2. Run `vercel` and follow the prompts to set up the project. When asked for a
#    deployment scope, select your personal account.
# 3. After setup, the CLI creates a `.vercel/project.json` file containing your `orgId` and `projectId`.
# 4. Generate a Vercel Account Token at https://vercel.com/account/tokens.
# 5. Add the following repository secrets to your GitHub repo (`ganemedelabs/saturon`):
#    - `ORG_ID` (from apps/docs/.vercel/project.json -> orgId)
#    - `PROJECT_ID` (from apps/docs/.vercel/project.json -> projectId)
#    - `VERCEL_TOKEN` (generated from your Vercel Account settings)
# ==============================================================================

name: Vercel Deployment Workflow

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    build_and_deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Deploy to Vercel
              uses: amondnet/vercel-action@v20
              id: vercel-deploy
              with:
                  vercel-token: ${{ secrets.VERCEL_TOKEN }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  vercel-args: ${{ github.event_name == 'push' && '--prod' || '' }}
                  vercel-org-id: ${{ secrets.ORG_ID }}
                  vercel-project-id: ${{ secrets.PROJECT_ID }}

            - name: Preview URL
              if: ${{ github.event_name == 'pull_request' }}
              run: |
                  echo "Preview URL: ${{ steps.vercel-deploy.outputs.preview-url }}"
